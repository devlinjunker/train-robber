# Publishes wiki/ to the GitHub wiki (https://github.com/devlinjunker/train-robber/wiki)
# on every push to main that touches it. wiki/ is the source of truth: edits made in
# the wiki's web editor are overwritten by the next sync, so change pages in a PR.
name: wiki
on:
  push:
    branches: [main]
    paths: ['wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push wiki/ to the wiki repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$GITHUB_WORKSPACE/wiki/." .
          git add -A
          if git diff --cached --quiet; then echo "Wiki already up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push origin HEAD
