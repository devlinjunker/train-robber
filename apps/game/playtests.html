<!doctype html>
<html><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Train Robber Playtests</title>
<style>
  :root { --bg:#1b1b1f; --panel:#25252b; --line:#3a3a42; --text:#e8e6e1; --muted:#9a978f; --accent:#e0a84a; --died:#e07a6a; --ok:#8cc084; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  main { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:24px 0 8px; color:var(--accent); }
  .muted { color:var(--muted); font-size:12px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  button, select, input { font:inherit; font-size:13px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  label { font-size:12px; color:var(--muted); display:flex; gap:4px; align-items:center; }
  .scroll { overflow-x:auto; border:1px solid var(--line); border-radius:6px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; white-space:nowrap; }
  th { background:var(--panel); font-weight:600; position:sticky; top:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.notes { white-space:normal; min-width:220px; color:var(--muted); }
  tr:last-child td { border-bottom:none; }
  .died { color:var(--died); } .cancelled, .retry { color:var(--accent); } .abandoned { color:var(--muted); }
  .empty { padding:24px; text-align:center; color:var(--muted); }
</style></head>
<body><main>
  <h1>Playtests</h1>
  <div class="muted">Every run played in this browser is recorded here automatically, with its outcome and notes (N in game). Import other testers' JSON exports to compare.</div>
  <div class="bar">
    <label>Your name <input id="tester" placeholder="for runs from now on" size="16" /></label>
    <button id="csv">Download CSV</button>
    <button id="json">Download JSON</button>
    <button id="import">Import JSON</button>
    <input id="importFile" type="file" accept=".json,application/json" multiple hidden />
    <button id="github">Send to GitHub</button>
  </div>
  <div class="bar" id="filters"></div>
  <h2>By setup</h2>
  <div class="scroll"><table id="summary"></table></div>
  <h2>Runs</h2>
  <div class="scroll"><table id="runs"></table></div>
</main><script type="module" src="/src/playtests.ts"></script></body></html>
